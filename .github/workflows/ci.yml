name: CI
on:
  push:
    tags: ['v*']
    branches: ['**']
  pull_request:
jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev desktop-file-utils appstream
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          components: rustfmt, clippy
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - name: Validate desktop entry and metainfo
        run: |
          desktop-file-validate data/io.github.vipruk.SwiftSwitcher.desktop
          appstreamcli validate --no-net data/io.github.vipruk.SwiftSwitcher.metainfo.xml
  package:
    runs-on: ubuntu-24.04
    needs: check
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y pkg-config libdbus-1-dev libgtk-4-dev libadwaita-1-dev
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
      - run: cargo install cargo-deb --version 3.8.0 --locked
      - run: cargo deb -p swiftswitcher
      - run: cargo build --release -p swiftswitcher
      - name: Download appimagetool
        # The maintainer pins the tool by setting APPIMAGETOOL_SHA256 below;
        # while it is empty the download is not verified.
        env:
          APPIMAGETOOL_SHA256: ""
        run: |
          curl -fsSL -o appimagetool https://github.com/AppImage/appimagetool/releases/download/1.9.0/appimagetool-x86_64.AppImage
          chmod +x appimagetool
          if [ -n "$APPIMAGETOOL_SHA256" ]; then
            echo "$APPIMAGETOOL_SHA256  appimagetool" | sha256sum -c -
          fi
      - name: Build AppImage
        env:
          APPIMAGETOOL: ${{ github.workspace }}/appimagetool
          APPIMAGE_EXTRACT_AND_RUN: "1"
        run: packaging/appimage/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: packages
          path: |
            target/debian/*.deb
            target/SwiftSwitcher-*-x86_64.AppImage
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: packages
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/**/*.deb
            dist/**/*.AppImage
