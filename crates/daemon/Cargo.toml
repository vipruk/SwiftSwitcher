[package]
name = "swiftswitcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "swiftswitcher"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
dirs = "7.0.0"
serde = { version = "1.0.229", features = ["derive"] }
swift-engine = { version = "0.1.0", path = "../engine" }
toml = "1.1.8"

[dev-dependencies]
tempfile = "3.27.0"
