[package]
name = "swiftswitcher"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[[bin]]
name = "swiftswitcher"
path = "src/main.rs"

[dependencies]
adw = { version = "0.9.2", package = "libadwaita", features = ["v1_5"] }
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive"] }
dirs = "7.0.0"
env_logger = "0.11.11"
evdev = { version = "0.13.2", features = ["tokio"] }
gtk = { version = "0.11.5", package = "gtk4", features = ["v4_14"] }
ksni = "0.3.7"
log = "0.4.35"
serde = { version = "1.0.229", features = ["derive"] }
swift-engine = { version = "0.1.0", path = "../engine" }
tokio = { version = "1.54.1", features = ["rt-multi-thread", "signal", "macros", "time", "sync"] }
toml = "1.1.8"
zbus = { version = "6.2.0", default-features = false, features = ["tokio", "proxy", "service"] }

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util"] }
